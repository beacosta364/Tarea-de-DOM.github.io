
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Organizador Semanal</title>
    <link rel="stylesheet" href="Css/styles.css">
</head>
<body>
    <div class="container">
        <h1>Mi Organizador Semanal</h1>

        <!-- Pantalla principal: listas -->
        <section id="lists-section">
            <h2>Mis listas</h2>

            <div class="list-creator">
                <input
                    id="list-name"
                    type="text"
                    placeholder="Nombre de la lista"
                    maxlength="60"
                >
                <button id="add-list" type="button">
                    Crear lista
                </button>
            </div>

            <ul id="lists-container"></ul>
        </section>

        <!-- Pantalla de tareas -->
        <section id="tasks-section" hidden>
            <button
                id="back-to-lists"
                class="secondary-button"
                type="button"
            >
                ← Volver a mis listas
            </button>

            <h2 id="current-list-title"></h2>

            <!-- Selector de días de la semana -->
            <div id="week-days" class="week-days"></div>

            <h3 id="current-day-title"></h3>

            <!-- Crear una tarea -->
            <div class="task-creator">
                <input
                    id="todo-title"
                    type="text"
                    placeholder="Nueva tarea"
                    maxlength="200"
                >
                <button id="add-todo" type="button">
                    Añadir tarea
                </button>
            </div>

            <!-- Lista de tareas del día seleccionado -->
            <ul id="todo-list"></ul>

            <p id="empty-message" class="empty-message" hidden>
                No hay tareas para este día.
            </p>
        </section>
    </div>

    <!-- Ventana emergente para editar tareas y notas -->
    <div id="task-modal" class="modal" hidden>
        <div
            class="modal-content"
            role="dialog"
            aria-modal="true"
            aria-labelledby="modal-title"
        >
            <h2 id="modal-title">Editar tarea</h2>

            <!-- Nombre de la tarea -->
            <label for="modal-task-title">
                Nombre de la tarea
            </label>
            <input
                id="modal-task-title"
                type="text"
                maxlength="200"
                placeholder="Nombre de la tarea"
            >

            <!-- Cambiar el día de la tarea -->
            <label for="modal-task-day">
                Día de la semana
            </label>
            <select id="modal-task-day">
                <!-- Los días se cargan desde JavaScript -->
            </select>

            <!-- Nota asociada a la tarea -->
            <label for="modal-task-note">
                Nota (opcional)
            </label>
            <textarea
                id="modal-task-note"
                rows="4"
                maxlength="1000"
                placeholder="Escribe detalles, recordatorios o pasos para esta tarea..."
            ></textarea>

            <!-- Acciones de la ventana -->
            <div class="modal-actions">
                <button id="save-task" type="button">
                    Guardar cambios
                </button>

                <button
                    id="cancel-task"
                    class="secondary-button"
                    type="button"
                >
                    Cancelar
                </button>
            </div>
        </div>
    </div>

    <!-- JavaScript de la aplicación -->
    <script src="js/script.js"></script>
</body>
</html>
